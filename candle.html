<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>CANDLE — SAMUSIGNAL AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--card:#0b0c10;--tx:#f3efe6;--mu:#a39a86;--mu2:#7f7866;--gold:#e8c35a;--up:#2fe08a;--dn:#ff5d6c;--dn2:#ff7a86;--line:rgba(232,195,90,0.2);
--metal:linear-gradient(120deg,#f7e08a 0%,#c9971f 30%,#fff6cf 48%,#b8bcc4 66%,#e8c35a 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
/* 1.2.1: page kabhi side me na khiske (chaudi pill se page phail jaata tha, neeche ke button khisak jaate the) */
html,body{overflow-x:hidden;max-width:100%}
#app{max-width:100vw;overflow-x:hidden}
#main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:96px}
.mono{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu)}
.mt{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
header.top a.back{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:18px}
header.top .tt{flex:1;min-width:0}
.h1{font-family:Cinzel,serif;font-weight:700;font-size:20px;letter-spacing:1.4px;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 0}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:4px 9px;border:1px solid var(--line);color:var(--mu);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{color:var(--up);border-color:rgba(47,224,138,0.5)}
.pill.warn{color:var(--gold);border-color:rgba(232,195,90,0.55)}
.pill.bad{color:var(--dn2);border-color:rgba(255,93,108,0.5)}
.wrap{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.card{border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));border:1px solid rgba(232,195,90,0.22);padding:14px}
.bar{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,0.03)}
.seg button{border:0;background:transparent;color:var(--mu);font-weight:800;font-size:13px;padding:7px 14px;border-radius:9px}
.seg button.on{background:var(--metal);color:#1a1408}
.cdbox{flex:1;text-align:right}
.cdbox b{font-size:22px;font-weight:800}
.cdbox small{display:block;font-size:10.5px;color:var(--mu)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;padding:6px 0}
.tg small{display:block;font-weight:500;color:var(--mu);font-size:11.5px}
.tg button{min-width:64px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);font-weight:800;font-size:12px}
.tg button.on{background:var(--gold);color:#1a1408;border-color:transparent}
.pc{border-radius:18px;padding:14px;border:1px solid rgba(232,195,90,0.22);background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015))}
.pc .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pc .hd b{font-size:19px;font-weight:800}
.pc .hd span{font-size:13px;color:var(--mu)}
.sig{border-radius:18px;padding:14px;color:#fff;margin-top:10px;position:relative;overflow:hidden}
.sig.BUY{background:linear-gradient(160deg,#1fcf7a,#0b7a46 70%,#064b2b)}
.sig.SELL{background:linear-gradient(160deg,#ff4a58,#a31525 70%,#6b0d19)}
.sig.OLD{filter:saturate(0.35) brightness(0.8)}
.sig .dir{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px}
.sig .ln{font-size:12.5px;margin-top:6px;opacity:.95;line-height:1.5}
.sig .vt{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;background:rgba(0,0,0,0.3);border-radius:999px;padding:4px 10px}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:12px}
.btn{height:50px;border-radius:14px;border:0;font-weight:800;font-size:14px;letter-spacing:.4px;padding:0 14px}
.btn.mt5{background:#fff;color:#0b0c10}
.btn.pp{background:rgba(0,0,0,0.28);color:#fff;border:1px solid rgba(255,255,255,0.55)}
.btn.gold{background:var(--metal);color:#1a1408}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--tx);border:1px solid var(--line);height:42px;font-size:13px}
.btn[disabled]{opacity:.45}
.no{margin-top:10px;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.14);font-size:13px;color:var(--mu);line-height:1.5}
.no b{color:var(--tx)}
/* 1.3.0: SL tulna table */
table.cmp{width:100%;border-collapse:collapse;font-size:12px}
table.cmp th{text-align:left;color:var(--mu);font-weight:700;font-size:11px;padding:4px 2px;border-bottom:1px solid var(--line)}
table.cmp td{padding:7px 2px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:top}
table.cmp td small{display:block;color:var(--mu);font-size:10.5px}
table.cmp td:first-child{width:46%}
/* 1.0.4: naye signal ka poori screen flash */
#flash{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;cursor:pointer}
#flash.on{display:flex;animation:fl .6s ease-in-out infinite alternate}
#flash.BUY{background:radial-gradient(circle at 50% 45%,rgba(31,207,122,0.97),rgba(6,75,43,0.97))}
#flash.SELL{background:radial-gradient(circle at 50% 45%,rgba(255,74,88,0.97),rgba(107,13,25,0.97))}
#flash .fdir{font-size:min(30vw,150px);font-weight:900;letter-spacing:4px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,0.45)}
#flash .fsym{font-size:34px;font-weight:900;letter-spacing:2px}
#flash .fln{font-size:15px;font-weight:700;opacity:.95;padding:0 20px}
#flash .fx{margin-top:18px;font-size:12px;opacity:.75}
@keyframes fl{from{filter:brightness(1)}to{filter:brightness(1.35)}}
/* 1.0.2: No Trade = gehra hara bold; wajah + candle / RSI / EMA = gehra peela */
.no b.nt{color:#16a34a;font-weight:800}
.no .why{color:#d4a72c;font-weight:600}
.no .kv,.no .kv b{color:#d4a72c}
.kv{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--mu);margin-top:8px}
.kv b{color:var(--tx);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tile{border-radius:12px;padding:8px 4px;text-align:center;background:rgba(255,255,255,0.05);border:1px solid rgba(232,195,90,0.2);font-size:10.5px;color:var(--mu)}
.tile b{display:block;font-size:17px;margin-top:2px;color:var(--tx)}
.up{color:var(--up)!important}.dn{color:var(--dn2)!important}.gd{color:var(--gold)!important}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px solid rgba(232,195,90,0.12)}
.hrow small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.hrow .r{text-align:right;white-space:nowrap;font-weight:800}
h3{margin:0 0 6px;font-size:14px;letter-spacing:.4px}
.note{font-size:12px;color:var(--mu);line-height:1.55}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(232,195,90,0.1);font-size:14px;font-weight:700}
.prow small{display:block;font-size:11px;color:var(--mu);font-weight:500}
.prow button{min-width:58px;height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);font-weight:800;font-size:12px}
.prow button.on{background:var(--gold);color:#1a1408;border-color:transparent}
.srch{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,0.35);color:var(--tx);font-size:14px;padding:0 12px}
.empty{padding:22px 10px;text-align:center;color:var(--mu);font-size:13px;line-height:1.6}
.warn{border-radius:12px;padding:9px 11px;background:rgba(232,195,90,0.1);border:1px solid rgba(232,195,90,0.4);color:var(--gold);font-size:12.5px;line-height:1.5}
nav.bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(7,8,11,0),#07080b 30%);padding:14px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bot .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:480px;padding:0 14px}
nav.bot button{border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--mu);border-radius:14px;padding:9px 0;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button b{font-size:17px;font-weight:400}
nav.bot button.on{background:var(--metal);color:#1a1408;border-color:transparent}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b1c22;border:1px solid var(--gold);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:13px;max-width:88%;z-index:30;display:none;text-align:center}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:40}
#dlg.on{display:flex}
#dlg .box{width:100%;max-width:480px;background:#111217;border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#dlg .bt{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:14px}
#dlgT{font-size:16px;font-weight:800;margin-bottom:8px}
.acc{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="index.html" title="SAMUSIGNAL AI" onclick="return goHome(event)">←</a>
    <script>/* back: app ke andar pichhle page par (nayi navigation nahi) — warna kuch phone / APK me app band ho jaata tha */
    function goHome(e){ try{ var r = document.referrer ? new URL(document.referrer) : null;
      if(r && r.origin === location.origin && history.length > 1){ e.preventDefault(); history.back(); return false } }catch(x){}
      e.preventDefault(); location.replace(new URL("index.html", location.href).href); return false }</script>
    <div class="tt"><div class="h1 mt">CANDLE</div><div class="lbl">अगली candle का BUY / SELL · Strategy 5</div></div>
    <span class="lbl" id="ver"></span>
  </header>
  <div class="chips" id="chips"></div>
  <div id="main"></div>
</div>
<nav class="bot"><div class="in" id="nav"></div></nav>
<div id="toast"></div>
<div id="flash" data-act="flashoff"></div>
<div id="dlg"><div class="box"><div id="dlgT"></div><div id="dlgB"></div><div class="bt"><button class="btn ghost" id="dlgNo">Cancel</button><button class="btn gold" id="dlgOk">OK</button></div></div></div>
<script type="module" src="src/candle.js"></script>
</body>
</html>
