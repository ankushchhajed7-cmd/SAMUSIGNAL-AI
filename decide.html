<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BUY YA SELL? — SAMUSIGNAL AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--tx:#f3efe6;--mu:#a39a86;--mu2:#7f7866;--gold:#e8c35a;--gold2:#c9971f;--up:#2fe08a;--dn:#ff5d6c;--line:rgba(232,195,90,0.22);
--metal:linear-gradient(120deg,#f7e08a 0%,#c9971f 30%,#fff6cf 48%,#b8bcc4 66%,#e8c35a 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:40px}
.mono{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mu)}
.serif{font-family:Cinzel,serif}
.mt{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
header.top a.back{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:18px}
header.top .tt{flex:1;min-width:0}
.h1{font-family:Cinzel,serif;font-weight:700;font-size:21px;letter-spacing:2px;line-height:1.1}
.clock{text-align:right;font-size:10.5px;color:var(--mu);line-height:1.35}
.clock b{color:var(--gold);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.5px;border-radius:999px;padding:4px 9px;border:1px solid var(--line);color:var(--mu);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{color:var(--up);border-color:rgba(47,224,138,0.5)}
.pill.warn{color:var(--gold);border-color:rgba(232,195,90,0.55)}
.pill.bad{color:#ff8a95;border-color:rgba(255,93,108,0.5)}
.wrap{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.card{border-radius:18px;background:linear-gradient(180deg,rgba(232,195,90,0.06),rgba(255,255,255,0.01));border:1px solid var(--line);padding:14px}
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.hero .big{font-family:Cinzel,serif;font-size:26px;font-weight:700;line-height:1.15}
.alert{border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.5;border:1px solid rgba(255,93,108,0.45);background:rgba(255,93,108,0.1);color:#ffc0c6}
.alert.g{border-color:rgba(232,195,90,0.45);background:rgba(232,195,90,0.08);color:#f1dfaa}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,0.08);position:relative;overflow:hidden;margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--metal)}
.bar.dim i{background:linear-gradient(90deg,#5c5240,#8c7a52)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.75}
.csm{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.csm div{text-align:center;font-size:10px;color:var(--mu)}
.csm b{display:block;font-size:12px;color:var(--tx)}
.csm s{display:block;height:34px;position:relative;margin:4px auto 3px;width:10px;border-radius:4px;background:rgba(255,255,255,0.06);text-decoration:none}
.csm s u{position:absolute;left:0;right:0;border-radius:4px;text-decoration:none}
.pr{border-radius:16px;padding:12px 13px;background:rgba(255,255,255,0.03);border:1px solid rgba(232,195,90,0.16)}
.pr.go{border-color:var(--gold);box-shadow:0 0 18px rgba(232,195,90,0.18)}
.pr .r1{display:flex;align-items:center;gap:8px}
.pr .nm{font-weight:800;font-size:16px;flex:1}
.pr .sc{font-family:Cinzel,serif;font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.pr .sc small{font-family:Manrope;font-size:11px;color:var(--mu);font-weight:700}
.dir{font-size:10.5px;font-weight:800;letter-spacing:1px;border-radius:8px;padding:3px 8px}
.dir.BUY{background:rgba(47,224,138,0.15);color:var(--up);border:1px solid rgba(47,224,138,0.4)}
.dir.SELL{background:rgba(255,93,108,0.14);color:#ff8a95;border:1px solid rgba(255,93,108,0.4)}
.dir.NO{color:var(--mu);border:1px solid var(--line)}
.st{font-size:12px;margin-top:7px;color:var(--mu);line-height:1.45}
.st.b{color:#ff9aa3}.st.k{color:var(--up)}
.det{margin-top:10px;border-top:1px dashed rgba(232,195,90,0.2);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.pt{display:grid;grid-template-columns:88px 44px 1fr;gap:8px;font-size:12px;align-items:start}
.pt .k{color:var(--mu);font-weight:700}
.pt .v{color:var(--gold);font-weight:800;text-align:right}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.lv div{border-radius:10px;padding:7px 6px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08);text-align:center;font-size:10px;color:var(--mu)}
.lv b{display:block;font-size:13.5px;color:var(--tx);margin-top:2px}
.lv .s b{color:#ff8a95}.lv .t b{color:var(--up)}.lv .e b{color:var(--gold)}
.why{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6}
.res{font-weight:800}.res.TP{color:var(--up)}.res.SL{color:#ff8a95}.res.TIME{color:var(--gold)}.res.EXPIRED{color:var(--mu2)}.res.OPEN{color:#7cc4f0}.res.PENDING{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{border-radius:12px;padding:9px 4px;text-align:center;background:rgba(255,255,255,0.03);border:1px solid rgba(232,195,90,0.16);font-size:10px;color:var(--mu)}
.tile b{display:block;font-family:Cinzel,serif;font-size:19px;color:var(--tx);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.06);text-align:right}
th{color:var(--mu);font-weight:700;font-size:10.5px;letter-spacing:.5px}
td:first-child,th:first-child{text-align:left}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06)}
.row:first-child{border-top:0}
.row .l2{font-size:11px;color:var(--mu)}
.btn{height:46px;border-radius:14px;border:0;font-weight:800;font-size:13.5px;letter-spacing:.5px;padding:0 16px}
.btn.gold{background:var(--metal);color:#1a1408}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:rgba(255,93,108,0.14);color:#ff9aa3;border:1px solid rgba(255,93,108,0.4)}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.set{display:flex;flex-direction:column;gap:12px}
.sg{font-size:12.5px;font-weight:700}
.sg small{display:block;color:var(--mu);font-weight:500;font-size:11px;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:48px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mu);font-weight:800;font-size:12.5px}
.seg button.on{background:var(--metal);color:#1a1408;border-color:transparent}
h3{margin:0 0 8px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.empty{padding:22px 10px;text-align:center;color:var(--mu);font-size:13px;line-height:1.6}
.note{font-size:11.5px;color:var(--mu);line-height:1.55}
nav.bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0),#000 30%);padding:14px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bot .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px;padding:0 14px}
nav.bot button{border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--mu);border-radius:14px;padding:9px 0;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button b{font-size:17px;font-weight:400}
nav.bot button.on{background:var(--metal);color:#1a1408;border-color:transparent}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14120c;border:1px solid var(--gold);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:13px;max-width:88%;z-index:30;display:none;text-align:center}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<div id="app">
  <header class="top">
    <a class="back" href="index.html" title="SAMUSIGNAL AI" onclick="return goHome(event)">←</a>
    <script>/* back: app ke andar pichhle page par (nayi navigation nahi) */
    function goHome(e){ try{ var r = document.referrer ? new URL(document.referrer) : null;
      if(r && r.origin === location.origin && history.length > 1){ e.preventDefault(); history.back(); return false } }catch(x){}
      e.preventDefault(); location.replace(new URL("index.html", location.href).href); return false }</script>
    <div class="tt"><div class="h1 mt">BUY YA SELL?</div><div class="lbl">5 AI agent · behes · judge · scalp $1/$2</div></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="chips" id="chips"></div>
  <div id="main"></div>
</div>
<div id="toast"></div>
